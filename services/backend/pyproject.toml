[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bring-vene-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "livekit==1.1.20",
  "livekit-api==1.2.1",
  "livekit-agents==1.8.6",
  "livekit-plugins-deepgram==1.8.6",
  "openai==2.54.0",
  "livekit-plugins-cartesia==1.8.6",
  "pypdf==6.20.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bring_vene"]

